proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=24h;
resolver 127.0.0.11 ipv6=off valid=30s;

# Temporary HTTP-only edge.
# The droplet currently has no mounted Let's Encrypt certs, so HTTPS listeners
# keep crash-looping. Serve tiles and optional API paths over port 80 until the
# certbot volumes / DNS are restored.
server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_types application/json application/geo+json application/x-protobuf text/plain;
    gzip_min_length 256;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering on;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range";
            add_header Content-Length 0;
            return 204;
        }
    }

    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        access_log off;
    }

    location = /catalog {
        set $tiles_upstream http://martin:3000;
        proxy_pass $tiles_upstream;
        proxy_set_header Host $host;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location / {
        set $tiles_upstream http://martin:3000;
        proxy_pass $tiles_upstream;
        proxy_set_header Host $host;

        proxy_cache tiles;
        proxy_cache_valid 200 6h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
