proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=24h;

upstream api {
    server api:8000;
}

upstream tiles {
    server martin:3000;
}

# Redirect HTTP to HTTPS (except ACME challenge)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server — api.opencatch.app
server {
    listen 443 ssl http2;
    server_name api.opencatch.app;

    ssl_certificate     /etc/letsencrypt/live/opencatch.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opencatch.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Gzip
    gzip on;
    gzip_types application/json application/geo+json application/x-protobuf text/plain;
    gzip_min_length 256;

    # CORS headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # API endpoints
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering on;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Health check
    location /health {
        proxy_pass http://api;
        access_log off;
    }
}

# Tile server — tiles.opencatch.app
server {
    listen 443 ssl http2;
    server_name tiles.opencatch.app;

    ssl_certificate     /etc/letsencrypt/live/opencatch.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opencatch.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Gzip
    gzip on;
    gzip_types application/json application/geo+json application/x-protobuf;
    gzip_min_length 256;

    # CORS
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Tile endpoints with aggressive cache
    location / {
        proxy_pass http://tiles;
        proxy_set_header Host $host;

        proxy_cache tiles;
        proxy_cache_valid 200 6h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;

        # Browser cache: 1 hour for tiles
        add_header Cache-Control "public, max-age=3600" always;
    }
}
