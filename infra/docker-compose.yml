services:
  # ── PostgreSQL + PostGIS ─────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: castline
      POSTGRES_USER: castline
      POSTGRES_PASSWORD: castline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/02-seed-locations.sql:/docker-entrypoint-initdb.d/02-seed-locations.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castline"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI prediction server ────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://castline:castline@db:5432/castline
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /app/castline/models
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:-castline-dev-secret-change-in-production}
      RATE_LIMIT_RPM: "100"
    volumes:
      - ../castline:/app/castline
      # Mount ML model artifacts directly
      - ../castline/models:/app/castline/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Martin vector tile server ────────────────────────────────
  martin:
    image: ghcr.io/maplibre/martin:v0.14.2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://castline:castline@db:5432/castline
    volumes:
      - ./martin/config.yaml:/config.yaml
    command: ["--config", "/config.yaml"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://0.0.0.0:3000/catalog"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Background worker (data refresh) ─────────────────────────
  worker:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    command: ["python", "-m", "castline.api.tasks.refresh_conditions"]
    environment:
      DATABASE_URL: postgresql+asyncpg://castline:castline@db:5432/castline
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /app/castline/models
      JWT_SECRET: ${JWT_SECRET:-castline-dev-secret-change-in-production}
    volumes:
      - ../castline:/app/castline
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      martin:
        condition: service_healthy

volumes:
  pgdata:
